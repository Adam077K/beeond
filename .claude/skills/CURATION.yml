# Skills namespaces — the discovery tier, authored FOR beeond FROM beeond's own library.
#
# ── WHY THIS FILE WAS AUTHORED AND NOT COPIED ────────────────────────────────────────────────
#
# agentvibe has a file of this name whose `namespaces:` map indexes ITS 134 skills. Copying it
# was measured before it was rejected, and it is wrong in both directions at once:
#
#     agentvibe's routed skills                     134
#       ... of those, also present in beeond         92
#       ... MISSING from beeond                      42   -> 42 pointers to nothing
#     beeond skills in NO agentvibe namespace        55   -> 55 skills invisible to discovery
#
# Re-derive rather than trusting those figures:
#   comm -12 <(ls -d .claude/skills/*/ | sed 's|.*skills/||;s|/$||' | sort) \
#            <(cd ../agentvibe && ls -d .claude/skills/*/ | sed 's|.*skills/||;s|/$||' | sort) | wc -l
#
# This is the fourth instance in this port of ONE pattern: a curated list describes exactly one
# repository. `STEPS`, the tier map, the ledger exemptions, and now this. The cure is the same
# every time — generate from local truth, or author locally. This file is the "author locally"
# half; `scripts/build-skill-routers.mjs` is the "generate from local truth" half, and it reads
# this file plus MANIFEST.json plus the directory itself.
#
# ── WHAT THIS FILE IS NOT, SAID PLAINLY SO ITS ABSENCE IS NOT READ AS A DECISION ──────────────
#
# agentvibe's CURATION.yml is mostly a CUT RECORD: every skill removed from its corpus, with the
# test that removed it (`role_duplicate`, `near_duplicate`, `reconstructible`, `dead_subject`)
# and a reason a reviewer can argue with. NONE OF THAT IS HERE, and none of it is implied. That
# editorial pass has never been run against beeond's 147 skills. Inventing entries for it would
# be fabricating a review nobody did, which is worse than having no cut record at all.
#
# Consequently `scripts/curate-skills.mjs` is DELIBERATELY NOT PORTED. It exists to prove the
# skills directory matches a cut record; with no cut record it would either fail on every skill
# or, worse, pass vacuously. When someone actually curates beeond's library, port it then — the
# generator below does not need it and never reads those keys.
#
# ── THE `thinking` NAMESPACE IS ABSENT, AND THAT IS A MEASUREMENT ─────────────────────────────
#
# agentvibe routes 28 `thinking-*` skills. beeond has ZERO of them:
#   ls -d .claude/skills/thinking*/ 2>/dev/null | wc -l   ->   0
# So the namespace is omitted rather than declared empty. An empty namespace would still get an
# INDEX.md row and a `thinking.md` file — a signposted route to nothing, paid for on every
# lookup. If the thinking library is ever installed here, add the key back and regenerate.
# `scripts/build-skill-routers.mjs` has a HEADLINE for `thinking` already, so that is one line.
#
# ── HOW THE 55 beeond-ONLY SKILLS WERE CLASSIFIED ────────────────────────────────────────────
#
# The 92 shared with agentvibe INHERIT its assignment unchanged. That decision was already made
# with care upstream; re-deciding it would be waste and would make the two repositories disagree
# about where one skill lives.
#
# The other 55 were classified by reading each `SKILL.md` frontmatter `description`, never the
# directory name — names mislead. Three that would have been misfiled by name alone:
#   `design-mirror`      reference EXTRACTION, not design       (inherited: frontend-design)
#   `search-specialist`  research procedure, not site search    (ai-agents, beside deep-research)
#   `humanizer`          prose editing, nothing to do with UX   (business-growth, see below)
#
# The six genuinely contestable calls are marked `# JUDGEMENT` inline below, with the reasoning
# on the line. They are marked rather than smoothed over because the next reader deserves to
# know which lines are settled and which are one person's reading of a description.
#
# ── THE ARITHMETIC, AND WHAT ENFORCES IT ─────────────────────────────────────────────────────
#
#   engineering       28  (16 inherited + 12 new)
#   frontend-design   26  (19 inherited +  7 new)
#   quality-security  28  (17 inherited + 11 new)
#   ai-agents         27  (14 inherited + 13 new)
#   ops-delivery      21  (13 inherited +  8 new)
#   business-growth   17  (13 inherited +  4 new)
#   ----------------------------------------------
#   TOTAL            147  (92 inherited + 55 new)  == skills on disk
#
# A skill in NO namespace is unreachable through the routers; a skill in TWO makes the routers
# disagree about where it lives. Both are silent at read time, so `npm run check:skill-routers`
# makes them loud at build time — it refuses to write anything while an orphan, a duplicate or a
# ghost exists, and CI runs it as its own step. Do not fix a failure by deleting the name it
# reports; the name is the finding.
#
# Assignment is DATA, not a heuristic over skill names. A regex inferring "security" from a
# filename works until `sharp-edges` or `trust-spec-contracts`, and is then silently wrong.

